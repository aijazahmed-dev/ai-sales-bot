<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 480" width="560" height="480" role="img" aria-label="AI chatbot answering a visitor and capturing a lead">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#4338CA" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="560" height="480" rx="32" fill="#EEF2FF"/>
  <circle cx="500" cy="60" r="70" fill="#C7D2FE" opacity="0.6"/>
  <circle cx="40" cy="440" r="60" fill="#C7D2FE" opacity="0.6"/>

  <g transform="translate(0,10)">
    <!-- chat window -->
    <rect x="40" y="40" width="400" height="380" rx="20" fill="#FFFFFF" filter="url(#shadow)"/>
    <rect x="40" y="40" width="400" height="56" rx="20" fill="#4F46E5"/>
    <rect x="40" y="70" width="400" height="26" fill="#4F46E5"/>
    <circle cx="72" cy="68" r="14" fill="#FFFFFF"/>
    <text x="72" y="73" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#4F46E5" text-anchor="middle">AI</text>
    <text x="96" y="67" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">AI Assistant</text>
    <circle cx="100" cy="80" r="4" fill="#34D399"/>
    <text x="110" y="84" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#E0E7FF">Online now</text>

    <!-- messages -->
    <rect x="60" y="116" width="240" height="44" rx="14" fill="#F3F4F6"/>
    <text x="74" y="143" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1F2937">Hi! How can I help you today?</text>

    <rect x="190" y="176" width="230" height="44" rx="14" fill="#4F46E5"/>
    <text x="206" y="203" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#FFFFFF">What are your prices?</text>

    <rect x="60" y="236" width="300" height="64" rx="14" fill="#F3F4F6"/>
    <text x="74" y="262" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1F2937">Happy to help! Can I get your</text>
    <text x="74" y="282" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1F2937">email to send you the details?</text>

    <rect x="230" y="316" width="190" height="44" rx="14" fill="#4F46E5"/>
    <text x="246" y="343" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#FFFFFF">sara@example.com</text>

    <!-- input bar -->
    <rect x="60" y="372" width="360" height="36" rx="18" fill="#F3F4F6"/>
    <text x="78" y="395" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#9CA3AF">Type a message...</text>
    <circle cx="398" cy="390" r="12" fill="#4F46E5"/>
    <path d="M393 390 h10 m-4 -4 l4 4 l-4 4" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- floating "hot lead" card -->
  <g filter="url(#shadow)">
    <rect x="330" y="376" width="214" height="72" rx="16" fill="#FFFFFF"/>
  </g>
  <circle cx="364" cy="412" r="16" fill="#10B981"/>
  <path d="M356 412 l6 6 l11 -12" stroke="#FFFFFF" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="392" y="406" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#111827">New hot lead!</text>
  <text x="392" y="426" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#6B7280">Your team was emailed</text>
</svg>
