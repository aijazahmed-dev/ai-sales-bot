<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/static/css/tailwind.css" />
  <title>AI Sales Chat Bot</title>

  <!-- Tailwind CSS -->
  <link rel="stylesheet" href="/static/css/tailwind.css" />

  <!-- Optional favicon -->
  <link rel="icon" href="/static/favicon.ico" />
</head>
<body class="bg-gray-50 text-gray-800 flex flex-col min-h-screen">

  <!-- HEADER -->
  <header class="bg-white shadow-sm">
    <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
      <h1 class="text-xl font-bold text-indigo-600">AI Sales Chat Bot</h1>
      <nav class="space-x-6">
        <a href="/index.html" class="text-gray-600 hover:text-indigo-600">Home</a>
        <a href="#" class="text-gray-600 hover:text-indigo-600">Features</a>
        <a href="#" class="text-gray-600 hover:text-indigo-600">Contact</a>
      </nav>
    </div>
  </header>

  <!-- MAIN DEMO CONTENT -->
  <main class="flex-1 flex flex-col items-center justify-center py-20">
    <section class="text-center mb-16">
        <!-- This will be injected by chat_widget.js -->
        <div id="ai-chat-widget" class="fixed bottom-4 right-4 w-80 max-w-full bg-white shadow-lg rounded-lg border hidden z-50 font-sans">
        <!-- Header -->
            <div class="bg-indigo-600 text-white px-4 py-2 rounded-t-lg flex justify-between items-center cursor-pointer" id="chat-widget-header">
                <h3 class="font-semibold text-sm">AI Chat Bot</h3>
                <button id="chat-widget-close" class="text-white font-bold">&times;</button>
            </div>

            <!-- Messages area -->
            <div id="chat-widget-messages" class="p-4 h-64 overflow-y-auto flex flex-col gap-2 bg-gray-50">
            <!-- Messages will be appended here -->
            </div>

            <!-- Input area -->
            <div class="px-4 py-2 border-t flex gap-2">
                <input type="text" id="chat-widget-input" placeholder="Type a message..." class="flex-1 border rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500"/>
                <button id="chat-widget-send" class="bg-indigo-600 text-white px-3 py-2 rounded-lg hover:bg-indigo-700">Send</button>
            </div>
        </div>
    </section>
  </main>

  <!-- FOOTER -->
  <footer class="bg-gray-900 text-gray-300 mt-auto">
    <div class="max-w-7xl mx-auto px-6 py-8 flex flex-col md:flex-row justify-between">
      <p>© 2026 AI Chat Bot. All rights reserved.</p>
      <div class="space-x-4 mt-4 md:mt-0">
        <a href="#" class="hover:text-white">Privacy</a>
        <a href="#" class="hover:text-white">Terms</a>
        <a href="#" class="hover:text-white">Contact</a>
      </div>
    </div>
  </footer>

  <!-- CHAT WIDGET SCRIPT -->
  <script src="/static/js/chat_widget.js"></script>

  <!-- Optional: open chat automatically -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      if (typeof openChatWidget === "function") {
        openChatWidget(); // opens chat when demo page loads
      }
    });
  </script>

</body>
</html>

<script src="/static/js/chat_widget.js"></script>
